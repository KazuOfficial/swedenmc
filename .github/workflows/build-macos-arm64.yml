name: Build macOS Silicon

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install minizip

      - name: Get submodule hashes
        id: hashes
        run: |
          echo "bgfx=$(git -C lib/bgfx rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "glfw=$(git -C lib/glfw rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "openal=$(git -C lib/openal-soft rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache bgfx
        uses: actions/cache@v4
        with:
          path: lib/bgfx/.build/osx-arm64
          key: bgfx-osx-arm64-${{ steps.hashes.outputs.bgfx }}
          restore-keys: bgfx-osx-arm64-

      - name: Cache GLFW
        uses: actions/cache@v4
        with:
          path: lib/glfw/build
          key: glfw-macos-${{ steps.hashes.outputs.glfw }}

      - name: Cache OpenAL
        uses: actions/cache@v4
        with:
          path: lib/openal-soft/build
          key: openal-macos-${{ steps.hashes.outputs.openal }}

      - name: Cache shaders
        uses: actions/cache@v4
        with:
          path: src/shaders/*.h
          key: shaders-osx-arm64-${{ steps.hashes.outputs.bgfx }}-${{ hashFiles('src/shaders/*.sc', 'src/shaders/varying.def.sc') }}
          restore-keys: shaders-osx-arm64-${{ steps.hashes.outputs.bgfx }}-

      - name: Build deps
        run: make -j$(sysctl -n hw.logicalcpu) deps

      - name: Build shaders
        run: make -j$(sysctl -n hw.logicalcpu) shaders

      - name: Build game
        run: |
          make -j$(sysctl -n hw.logicalcpu)
          test -f bin/swedenmc

      - name: Package artifact
        run: |
          mkdir -p release
          cp bin/swedenmc release/swedenmc-macos-arm64
          tar -czf swedenmc-macos-arm64.tar.gz -C release swedenmc-macos-arm64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swedenmc-macos-arm64
          path: swedenmc-macos-arm64.tar.gz
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: swedenmc-macos-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: swedenmc-macos-arm64.tar.gz
          generate_release_notes: true
